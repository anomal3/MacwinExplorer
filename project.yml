name: MacwinExplorer
options:
  bundleIdPrefix: com.macwinexplorer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
targets:
  MacwinExplorer:
    type: application
    platform: macOS
    sources:
      - path: MacwinExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macwinexplorer.app
        PRODUCT_NAME: MacwinExplorer
        INFOPLIST_KEY_CFBundleDisplayName: MacwinExplorer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: Quartz.framework
      - sdk: NetFS.framework
      - sdk: ServiceManagement.framework
